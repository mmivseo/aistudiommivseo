<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>나에게 맞는 직무 유형 테스트</title>
  <meta name="description" content="산업디자인 전공 2학년을 위한 12문항 일하는 스타일 진단 및 자동차·AI·UX 직무 가이드" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Outfit:wght@600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg-base: #F7F7F5;
      --bg-surface: #FFFFFF;
      --bg-muted: #EFEFED;
      --border-hairline: #E2E2DE;
      --border-strong: #D4D4CE;
      --text-primary: #111827;
      --text-secondary: #374151;
      --text-muted: #6B7280;
      --accent: #1D4ED8;
      --accent-hover: #1E40AF;
      --radius-lg: 12px;
      --radius-xl: 16px;
      --font-sans: "IBM Plex Sans KR", "Outfit", -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
      --font-mono: "JetBrains Mono", ui-monospace, SFMono-Regular, monospace;
    }

    *, *::before, *::after {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
      font-family: var(--font-sans);
    }

    body {
      margin: 0;
      background-color: var(--bg-base);
      color: var(--text-primary);
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    button {
      font-family: inherit;
      cursor: pointer;
    }

    button:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    .tabular-nums {
      font-variant-numeric: tabular-nums;
    }

    .font-mono {
      font-family: var(--font-mono);
    }

    .container {
      width: 100%;
      max-width: 1120px;
      margin: 0 auto;
      padding: 0 24px;
    }

    .container-narrow {
      width: 100%;
      max-width: 760px;
      margin: 0 auto;
      padding: 0 24px;
    }

    /* Header */
    .site-header {
      position: sticky;
      top: 0;
      z-index: 30;
      background: rgba(247, 247, 245, 0.94);
      backdrop-filter: blur(8px);
      border-bottom: 1px solid var(--border-hairline);
    }

    .header-inner {
      height: 64px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
    }

    .brand-btn {
      background: none;
      border: none;
      padding: 0;
      font-size: 17px;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: var(--text-primary);
      white-space: nowrap;
      flex-shrink: 0;
    }

    .brand-btn:hover {
      color: var(--accent);
    }

    .nav-links {
      display: none;
      align-items: center;
      gap: 24px;
    }

    @media (min-width: 768px) {
      .nav-links {
        display: flex;
      }
    }

    .nav-link {
      background: none;
      border: none;
      padding: 4px 0;
      font-size: 14px;
      font-weight: 500;
      color: #4B5563;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .nav-link:hover {
      color: var(--text-primary);
      text-decoration: underline;
      text-underline-offset: 4px;
    }

    .btn-primary {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background-color: var(--accent);
      color: #FFFFFF;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      white-space: nowrap;
      flex-shrink: 0;
      transition: opacity 0.15s ease, background-color 0.15s ease, transform 0.12s ease;
    }

    .btn-primary:hover {
      opacity: 0.92;
    }

    .btn-primary:active {
      transform: scale(0.99);
    }

    .btn-sm {
      padding: 8px 16px;
      font-size: 14px;
    }

    .btn-lg {
      padding: 14px 28px;
      font-size: 16px;
    }

    .btn-secondary {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background-color: #FFFFFF;
      color: var(--text-primary);
      border: 1px solid var(--border-strong);
      border-radius: 8px;
      padding: 10px 16px;
      font-size: 14px;
      font-weight: 500;
      white-space: nowrap;
      flex-shrink: 0;
      transition: background-color 0.15s ease;
    }

    .btn-secondary:hover {
      background-color: var(--bg-muted);
    }

    .btn-ghost {
      background: none;
      border: none;
      padding: 10px 12px;
      font-size: 14px;
      font-weight: 500;
      color: var(--text-secondary);
      white-space: nowrap;
    }

    .btn-ghost:hover {
      color: var(--text-primary);
      text-decoration: underline;
      text-underline-offset: 4px;
    }

    /* Main Layout */
    #app-root {
      flex: 1;
    }

    /* Hero Split */
    .hero-section {
      padding: 44px 0 56px;
    }

    @media (min-width: 1024px) {
      .hero-section {
        padding: 64px 0 72px;
      }
    }

    .hero-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 32px;
      align-items: stretch;
    }

    @media (min-width: 1024px) {
      .hero-grid {
        grid-template-columns: 1fr 1fr;
        gap: 48px;
      }
    }

    .hero-kicker {
      font-size: 14px;
      font-weight: 600;
      color: var(--accent);
      margin: 0 0 12px;
    }

    .hero-title {
      font-size: clamp(2.15rem, 3.8vw, 3.3rem);
      font-weight: 800;
      letter-spacing: -0.025em;
      line-height: 1.15;
      margin: 0 0 20px;
      text-wrap: balance;
    }

    .hero-desc {
      font-size: 17px;
      color: #4B5563;
      margin: 0 0 32px;
      max-width: 540px;
    }

    .hero-actions {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 14px;
      margin-bottom: 28px;
    }

    .hero-meta {
      padding-top: 20px;
      border-top: 1px solid var(--border-hairline);
      font-size: 13px;
      color: var(--text-muted);
      display: flex;
      flex-wrap: wrap;
      gap: 8px 10px;
    }

    .media-frame {
      border-radius: var(--radius-xl);
      border: 1px solid var(--border-hairline);
      background: #FFFFFF;
      overflow: hidden;
      min-height: 280px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Sections */
    .section-block {
      padding: 48px 0;
      border-top: 1px solid var(--border-hairline);
    }

    .section-kicker {
      font-size: 12px;
      font-weight: 600;
      color: var(--text-muted);
      margin: 0 0 4px;
    }

    .section-title {
      font-size: 24px;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin: 0 0 28px;
    }

    .grid-4 {
      display: grid;
      grid-template-columns: 1fr;
      gap: 20px;
    }

    @media (min-width: 640px) {
      .grid-4 {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @media (min-width: 1024px) {
      .grid-4 {
        grid-template-columns: repeat(4, 1fr);
      }
    }

    .card {
      background: #FFFFFF;
      border: 1px solid var(--border-hairline);
      border-radius: var(--radius-lg);
      padding: 24px;
    }

    .card-num {
      font-family: var(--font-mono);
      font-size: 12px;
      font-weight: 600;
      color: var(--accent);
      margin: 0 0 8px;
    }

    .card-title {
      font-size: 16px;
      font-weight: 700;
      margin: 0 0 8px;
    }

    .card-text {
      font-size: 14px;
      color: #4B5563;
      margin: 0;
    }

    /* Segmented Tabs */
    .roles-header {
      display: flex;
      flex-direction: column;
      gap: 16px;
      margin-bottom: 24px;
    }

    @media (min-width: 900px) {
      .roles-header {
        flex-direction: row;
        align-items: flex-end;
        justify-content: space-between;
      }
    }

    .tablist {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      padding: 4px;
      background: var(--bg-muted);
      border: 1px solid var(--border-hairline);
      border-radius: 10px;
    }

    .tab-btn {
      background: transparent;
      border: none;
      border-radius: 6px;
      padding: 7px 12px;
      font-size: 12px;
      font-weight: 600;
      color: #4B5563;
      white-space: nowrap;
    }

    .tab-btn.active {
      background: #FFFFFF;
      color: var(--text-primary);
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.05);
    }

    .preview-card {
      background: #FFFFFF;
      border: 1px solid var(--border-hairline);
      border-radius: var(--radius-xl);
      overflow: hidden;
      display: grid;
      grid-template-columns: 1fr;
    }

    @media (min-width: 900px) {
      .preview-card {
        grid-template-columns: 5fr 7fr;
      }
    }

    .preview-body {
      padding: 28px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 24px;
    }

    /* Quiz Screen */
    .quiz-stage {
      padding: 36px 0 72px;
    }

    .quiz-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }

    .progress-track {
      height: 6px;
      width: 100%;
      background: var(--border-hairline);
      border-radius: 999px;
      overflow: hidden;
      margin-bottom: 28px;
    }

    .progress-fill {
      height: 100%;
      width: 100%;
      background: var(--accent);
      transform-origin: left;
      transition: transform 0.2s ease;
    }

    .quiz-card {
      background: #FFFFFF;
      border: 1px solid var(--border-hairline);
      border-radius: var(--radius-xl);
      padding: 28px;
    }

    @media (min-width: 640px) {
      .quiz-card {
        padding: 36px;
      }
    }

    .quiz-prompt {
      font-size: clamp(1.3rem, 2.5vw, 1.65rem);
      font-weight: 700;
      line-height: 1.38;
      margin: 0 0 10px;
      text-wrap: balance;
    }

    .quiz-note {
      font-size: 14px;
      color: var(--text-muted);
      margin: 0 0 28px;
    }

    .options-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .option-btn {
      width: 100%;
      text-align: left;
      background: #FFFFFF;
      border: 1px solid var(--border-hairline);
      border-radius: 12px;
      padding: 16px 20px;
      display: flex;
      align-items: flex-start;
      gap: 14px;
      min-height: 70px;
      transition: border-color 0.15s ease, background-color 0.15s ease;
    }

    .option-btn:hover {
      border-color: #9CA3AF;
      background: #FAFAF8;
    }

    .option-btn.selected {
      border-color: var(--accent);
      background: #EFF6FF;
    }

    .option-key {
      width: 28px;
      height: 28px;
      border-radius: 6px;
      border: 1px solid var(--border-strong);
      background: var(--bg-base);
      font-family: var(--font-mono);
      font-size: 12px;
      font-weight: 600;
      color: #4B5563;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      margin-top: 2px;
    }

    .option-btn.selected .option-key {
      background: var(--accent);
      border-color: var(--accent);
      color: #FFFFFF;
    }

    .option-title {
      font-size: 15px;
      font-weight: 600;
      color: var(--text-primary);
      margin: 0 0 4px;
    }

    .option-sub {
      font-size: 13px;
      color: var(--text-muted);
      margin: 0;
    }

    /* Result Screen */
    .result-wrapper {
      padding: 36px 0 80px;
      transition: background-color 0.25s ease;
    }

    .result-stack {
      display: flex;
      flex-direction: column;
      gap: 32px;
    }

    .result-hero {
      border-radius: var(--radius-xl);
      border: 1px solid;
      overflow: hidden;
      display: grid;
      grid-template-columns: 1fr;
      transition: background-color 0.25s ease, border-color 0.25s ease;
    }

    @media (min-width: 960px) {
      .result-hero {
        grid-template-columns: 7fr 5fr;
      }
    }

    .result-hero-body {
      padding: 28px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 24px;
    }

    @media (min-width: 640px) {
      .result-hero-body {
        padding: 40px;
      }
    }

    .result-role-title {
      font-size: clamp(1.9rem, 4vw, 3rem);
      font-weight: 800;
      letter-spacing: -0.03em;
      line-height: 1.15;
      color: var(--text-primary);
      margin: 0 0 10px;
      text-wrap: balance;
    }

    .result-grid-2 {
      display: grid;
      grid-template-columns: 1fr;
      gap: 24px;
    }

    @media (min-width: 960px) {
      .result-grid-2 {
        grid-template-columns: 7fr 5fr;
      }
    }

    .axis-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 28px;
      align-items: center;
    }

    @media (min-width: 900px) {
      .axis-grid {
        grid-template-columns: 5fr 7fr;
      }
    }

    .bar-track {
      height: 8px;
      width: 100%;
      background: var(--bg-muted);
      border-radius: 999px;
      overflow: hidden;
      margin: 6px 0;
    }

    .bar-fill {
      height: 100%;
      width: 100%;
      transform-origin: left;
      transition: transform 0.3s ease;
    }

    .prep-btn {
      width: 100%;
      text-align: left;
      background: #FFFFFF;
      border: 1px solid var(--border-hairline);
      border-radius: 12px;
      padding: 16px;
      display: flex;
      align-items: flex-start;
      gap: 12px;
    }

    .prep-btn.checked {
      background: var(--bg-base);
      border-color: var(--border-strong);
    }

    .prep-btn.checked .prep-title {
      text-decoration: line-through;
      color: var(--text-muted);
    }

    .compare-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 12px;
    }

    @media (min-width: 640px) {
      .compare-grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @media (min-width: 1024px) {
      .compare-grid {
        grid-template-columns: repeat(4, 1fr);
      }
    }

    .compare-btn {
      text-align: left;
      border-radius: 12px;
      border: 1px solid var(--border-hairline);
      padding: 16px;
      background: #FFFFFF;
      transition: border-color 0.15s ease, background-color 0.15s ease;
    }

    .site-footer {
      border-top: 1px solid var(--border-hairline);
      background: var(--bg-base);
      padding: 24px 0;
      font-size: 12px;
      color: var(--text-muted);
    }

    .footer-inner {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    @media (min-width: 640px) {
      .footer-inner {
        flex-direction: row;
        align-items: center;
        justify-content: space-between;
      }
    }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <button type="button" id="btn-home" class="brand-btn">나에게 맞는 직무 유형 테스트</button>

      <nav class="nav-links" aria-label="주요 메뉴">
        <button type="button" class="nav-link" data-scroll="intro-section">테스트 안내</button>
        <button type="button" class="nav-link" data-scroll="roles-section">4가지 직무 유형</button>
        <button type="button" class="nav-link" data-scroll="guide-section">2학년 준비 가이드</button>
        <button type="button" class="nav-link" id="nav-start">처음 화면</button>
      </nav>

      <button type="button" id="header-cta" class="btn-primary btn-sm">시작하기</button>
    </div>
  </header>

  <div id="app-root"></div>

  <footer class="site-footer">
    <div class="container footer-inner">
      <span>나에게 맞는 직무 유형 테스트 · 산업디자인 2학년 진로 탐색</span>
      <span>12문항 일하는 스타일 진단 &amp; 자동차·AI·UX 직무 가이드</span>
    </div>
  </footer>

  <script>
    const AXES = [
      {
        key: 'tactile',
        label: '물성 · 형태 감각',
        shortLabel: '물성·형태',
        description: '손으로 만지는 버튼, 소재 질감, 비례감 등 눈에 보이고 손에 잡히는 완성도를 중요하게 보는 성향'
      },
      {
        key: 'ux',
        label: '사용자 경험 · 흐름',
        shortLabel: 'UX·흐름',
        description: '사람이 헷갈리지 않고 자연스럽게 쓰도록 화면 순서와 인터랙션 맥락을 정리하는 성향'
      },
      {
        key: 'ai',
        label: 'AI · 기술 실험',
        shortLabel: 'AI·실험',
        description: '새로운 AI 도구나 센서, 자동화 기술을 직접 만져보며 빠르게 아이디어를 구현해 보는 성향'
      },
      {
        key: 'system',
        label: '모빌리티 · 구조 기획',
        shortLabel: '구조·기획',
        description: '이동 상황과 전체 서비스 맥락을 넓게 바라보며 문제의 원인과 해결 구조를 짜는 성향'
      }
    ];

    const CAREER_TYPES = {
      'mobility-hmi': {
        id: 'mobility-hmi',
        indexLabel: '유형 01',
        title: '차량 HMI · 모빌리티 UX 디자이너',
        englishTitle: 'Automotive HMI & Mobility UX Designer',
        oneLiner: '운전자와 자동차, 그리고 AI 비서가 가장 안전하고 편하게 대화하는 방법을 설계합니다.',
        theme: {
          pageBg: '#F1F5FE',
          cardBg: '#E4EDFD',
          borderColor: '#C2D5FD',
          accentHex: '#1D4ED8',
          softBgHex: '#EFF6FF'
        },
        keywords: ['자동차 실내 화면', '운전 경험', '음성 AI 인터페이스', '물리 버튼과 터치 조화'],
        easyExplanation:
          'HMI(Human-Machine Interface)는 사람과 기계가 만나는 접점이라는 뜻입니다. 쉽게 말해 자동차 안의 계기판, 내비게이션 화면, 핸들 버튼, 그리고 "에어컨 켜줘"라고 말하면 알아듣는 차량용 AI 비서가 언제 어떤 정보를 보여줄지 설계하는 일입니다.',
        whyItFitsSophomore:
          '산업디자인 전공생은 스마트폰 화면만 보는 디자이너와 달리 "운전석에 앉았을 때 손이 닿는 거리", "실제 물리 다이얼과 화면 터치의 균형" 같은 공간 감각을 자연스럽게 이해할 수 있어 자동차 업계에서 아주 선호합니다.',
        strengths: [
          '자동차 공간과 디지털 화면을 따로 떼어놓지 않고 하나의 경험으로 연결해 생각합니다.',
          '운전 중 시선이 분산되지 않도록 꼭 필요한 정보만 추려내는 감각이 뛰어납니다.',
          'AI 기능이 들어갈 때 기술 자랑이 아니라 "운전자에게 언제 도움이 될까"를 먼저 따집니다.'
        ],
        watchOut:

    function escapeHtml(str) {

        .replace(/'/g, '&#39;');

    function calculateTestResult(answers) {
      const rawAxes = { tactile: 0, ux: 0, ai: 0, system: 0 };
      const maxAxes = { tactile: 0, ux: 0, ai: 0, system: 0 };
      const rawRoles = { 'mobility-hmi': 0, 'ai-product': 0, 'physical-prototyper': 0, 'ux-strategist': 0 };

      for (const q of QUIZ_QUESTIONS) {
        const selected = q.options.find((o) => o.id === answers[q.id]);
        for (const axis of ['tactile', 'ux', 'ai', 'system']) {
          maxAxes[axis] += Math.max(...q.options.map((o) => o.weights[axis]));
        }
        if (selected) {
          for (const axis of ['tactile', 'ux', 'ai', 'system']) {
            rawAxes[axis] += selected.weights[axis];
          }
          for (const [roleId, score] of Object.entries(selected.roleAffinity)) {
            rawRoles[roleId] += score || 0;
          }
        }
      }

      const axisScores = {
        tactile: Math.min(98, Math.max(18, Math.round((rawAxes.tactile / Math.max(1, maxAxes.tactile)) * 100))),
        ux: Math.min(98, Math.max(18, Math.round((rawAxes.ux / Math.max(1, maxAxes.ux)) * 100))),
        ai: Math.min(98, Math.max(18, Math.round((rawAxes.ai / Math.max(1, maxAxes.ai)) * 100))),
        system: Math.min(98, Math.max(18, Math.round((rawAxes.system / Math.max(1, maxAxes.system)) * 100)))
      };

      const combined = {
        'mobility-hmi': rawRoles['mobility-hmi'] * 3 + rawAxes.ux * 0.8 + rawAxes.tactile * 0.5 + rawAxes.ai * 0.4,
        'ai-product': rawRoles['ai-product'] * 3 + rawAxes.ai * 0.9 + rawAxes.ux * 0.8,
        'physical-prototyper': rawRoles['physical-prototyper'] * 3 + rawAxes.tactile * 1.0 + rawAxes.ai * 0.5,
        'ux-strategist': rawRoles['ux-strategist'] * 3 + rawAxes.system * 1.0 + rawAxes.ux * 0.7
      };

      const sortedRoles = Object.keys(combined).sort((a, b) => combined[b] - combined[a]);
      const totalScore = Object.values(combined).reduce((a, b) => a + b, 0) || 1;
      const roleMatchScores = {
        'mobility-hmi': Math.round((combined['mobility-hmi'] / totalScore) * 100),
        'ai-product': Math.round((combined['ai-product'] / totalScore) * 100),
        'physical-prototyper': Math.round((combined['physical-prototyper'] / totalScore) * 100),
        'ux-strategist': Math.round((combined['ux-strategist'] / totalScore) * 100)
      };

      const sortedAxes = [...AXES].sort((a, b) => axisScores[b.key] - axisScores[a.key]);

      return {
        primaryRole: CAREER_TYPES[sortedRoles[0]],
        secondaryRole: CAREER_TYPES[sortedRoles[1]],
        axisScores,
        roleMatchScores,
        topAxes: [sortedAxes[0], sortedAxes[1]]
      };
    }

    function renderRadarSvg(scores, accentColor) {
      const size = 280;
      const center = size / 2;
      const maxRadius = 92;
      const placement = [
        { key: 'ux', angle: -90, lx: center, ly: 20, anchor: 'middle', label: 'UX·흐름' },
        { key: 'ai', angle: 0, lx: size - 14, ly: center + 4, anchor: 'end', label: 'AI·실험' },
        { key: 'system', angle: 90, lx: center, ly: size - 10, anchor: 'middle', label: '구조·기획' },
        { key: 'tactile', angle: 180, lx: 14, ly: center + 4, anchor: 'start', label: '물성·형태' }
      ];

      const pt = (angle, ratio) => {
        const rad = (angle * Math.PI) / 180;
        return {
          x: center + Math.cos(rad) * maxRadius * ratio,
          y: center + Math.sin(rad) * maxRadius * ratio
        };
      };

      const rings = [0.25, 0.5, 0.75, 1].map((lvl) => {
        const pts = placement.map((a) => {
          const p = pt(a.angle, lvl);
          return `${p.x.toFixed(1)},${p.y.toFixed(1)}`;
        }).join(' ');
        return `<polygon points="${pts}" fill="none" stroke="#E2E2DE" stroke-width="1" />`;
      }).join('');

      const spokes = placement.map((a) => {
        const outer = pt(a.angle, 1);
        return `<line x1="${center}" y1="${center}" x2="${outer.x}" y2="${outer.y}" stroke="#E2E2DE" stroke-width="1" />`;
      }).join('');

      const dataPts = placement.map((a) => {
        const ratio = Math.max(0.15, Math.min(1, scores[a.key] / 100));
        return pt(a.angle, ratio);
      });

      const poly = dataPts.map((p) => `${p.x.toFixed(1)},${p.y.toFixed(1)}`).join(' ');
      const dots = dataPts.map((p) => `<circle cx="${p.x}" cy="${p.y}" r="4.5" fill="${accentColor}" stroke="#FFFFFF" stroke-width="1.5" />`).join('');
      const labels = placement.map((a) => `<text x="${a.lx}" y="${a.ly}" text-anchor="${a.anchor}" fill="#374151" font-size="11" font-weight="600">${a.label}</text>`).join('');

      return `
        <svg viewBox="0 0 ${size} ${size}" style="width:100%;max-width:280px;height:auto;display:block;margin:0 auto" role="img" aria-label="4가지 성향 레이더 차트">
          ${rings}${spokes}
          <polygon points="${poly}" fill="${accentColor}" fill-opacity="0.16" stroke="${accentColor}" stroke-width="2" stroke-linejoin="round" />
          ${dots}${labels}
        </svg>
      `;
    }

    async function copyToClipboard(text) {
      if (navigator.clipboard && window.isSecureContext) {
        try {
          await navigator.clipboard.writeText(text);
          return true;
        } catch {}
      }
      try {
        const ta = document.createElement('textarea');
        ta.value = text;
        ta.setAttribute('readonly', '');
        ta.style.position = 'fixed';
        ta.style.left = '-9999px';
        document.body.appendChild(ta);
        ta.select();
        const ok = document.execCommand('copy');
        document.body.removeChild(ta);
        return ok;
      } catch {
        return false;
      }
    }

                  오히려 요즘 스스로 시간을 쏟고 있는 자동차와 AI에 대한 호기심이 남들과 다른 진로 출발선이 됩니다.
                </p>
              </div>
              <div class="card" style="display:flex;flex-direction:column;gap:18px">
                <div>
                  <h3 class="card-title">자동차 + UX는 이미 큰 흐름입니다</h3>
                  <p class="card-text">요즘 자동차는 바퀴 달린 거대한 스크린이자 AI 디바이스입니다. 차체 외형을 그리는 카 디자이너 외에도 화면·조작감·탑승 경험을 설계하는 UX 디자이너 수요가 큽니다.</p>
                </div>
                <div style="padding-top:16px;border-top:1px solid var(--border-hairline)">
                  <h3 class="card-title">AI를 만져본 경험 자체가 실무 감각입니다</h3>
                  <p class="card-text">AI가 어디서 잘 답하고 어디서 엉뚱한 소리를 하는지 직접 써본 사람만이 "사용자가 쓰기 편한 AI 화면"을 설계할 수 있습니다.</p>
                </div>
                <div style="padding-top:16px;border-top:1px solid var(--border-hairline);display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:12px">
                  <span style="font-size:13px;color:#4B5563">12개 질문으로 지금 나에게 가장 잘 맞는 출발점을 확인해 보세요.</span>
                  <button type="button" id="guide-start-btn" class="btn-primary btn-sm">시작하기 →</button>
                </div>
              </div>
            </div>
          </section>
        </main>
      `;
    }

    function renderQuiz() {
      const q = QUIZ_QUESTIONS[state.currentIndex];
      const total = QUIZ_QUESTIONS.length;
      const selectedId = state.answers[q.id];
      const curStr = String(state.currentIndex + 1).padStart(2, '0');
      const totStr = String(total).padStart(2, '0');
      const ratio = (state.currentIndex + 1) / total;

      return `
        <main class="container-narrow quiz-stage">
          <div class="quiz-top">
            <button type="button" id="quiz-back-btn" class="btn-ghost" style="padding-left:0">
              ← ${state.currentIndex > 0 ? '이전 질문' : '시작 화면으로'}
            </button>
            <div class="font-mono tabular-nums" style="font-size:14px;font-weight:600">
              <span style="color:var(--accent)">${curStr}</span>
              <span style="color:#9CA3AF"> / </span>
              <span>${totStr}</span>
            </div>
          </div>

          <div class="progress-track">
            <div class="progress-fill" style="transform:scaleX(${ratio})"></div>
          </div>

          <section class="quiz-card">
            <p style="font-size:12px;font-weight:600;color:var(--accent);margin:0 0 10px">
              질문 ${curStr} · ${escapeHtml(q.category)}
            </p>
            <h1 class="quiz-prompt">${escapeHtml(q.prompt)}</h1>
            <p class="quiz-note">${escapeHtml(q.contextNote)}</p>

            <div class="options-list">
              ${q.options.map((opt, idx) => `
                <button type="button" class="option-btn ${selectedId === opt.id ? 'selected' : ''}" data-option-id="${opt.id}">
                  <span class="option-key">${selectedId === opt.id ? '✓' : idx + 1}</span>
                  <div>
                    <p class="option-title">${escapeHtml(opt.text)}</p>
                    <p class="option-sub">${escapeHtml(opt.subtext)}</p>
                  </div>
                </button>
              `).join('')}
            </div>

            <div style="margin-top:24px;padding-top:16px;border-top:1px solid var(--border-hairline);display:flex;justify-content:space-between;font-size:12px;color:var(--text-muted)">
              <span>하나를 선택하면 다음 질문으로 넘어갑니다</span>
              <span class="font-mono">키보드 1–4 선택 가능</span>
            </div>
          </section>
        </main>
      `;
    }

    function renderResult() {
      const res = state.result;
      const activeRole = CAREER_TYPES[state.viewedRoleId];
      const isPrimary = activeRole.id === res.primaryRole.id;
      const theme = activeRole.theme;
      const completedCount = activeRole.prepRoadmap.filter((i) => state.checkedItems[i.id]).length;

      return `
        <div class="result-wrapper" style="background-color:${theme.pageBg}">
          <main class="container result-stack">
            <!-- Top Hero Card with Role Background & Large Bold Title -->
            <section class="result-hero" style="background-color:${theme.cardBg};border-color:${theme.borderColor}">
              <div class="result-hero-body">
                <div>
                  <p style="font-size:14px;font-weight:700;color:${theme.accentHex};margin:0 0 12px">
                    ${isPrimary ? `12문항 진단 완료 · 나의 대표 직무 (${activeRole.indexLabel})` : `${activeRole.indexLabel} 상세 보기 · 다른 유형 비교 중`}
                  </p>
                  <h1 class="result-role-title">${escapeHtml(activeRole.title)}</h1>
                  <p style="font-size:13px;font-weight:500;color:#4B5563;margin:0 0 20px">${escapeHtml(activeRole.englishTitle)}</p>
                  <p style="font-size:18px;font-weight:600;color:#111827;margin:0 0 16px">${escapeHtml(activeRole.oneLiner)}</p>
                  <p style="font-size:13px;color:#4B5563;margin:0">${activeRole.keywords.join(' · ')}</p>
                </div>

                <div style="padding-top:24px;border-top:1px solid ${theme.borderColor};display:flex;flex-wrap:wrap;gap:12px">
                  <button type="button" id="share-btn" class="btn-primary" style="padding:12px 20px;font-size:14px;background-color:${theme.accentHex}">
                    ${state.copied ? '✓ 결과 텍스트가 클립보드에 복사되었어요' : '공유하기'}
                  </button>
                  <button type="button" id="retake-btn" class="btn-secondary">테스트 다시 하기</button>
                </div>
              </div>
              <div style="background:rgba(255,255,255,0.65);display:flex;align-items:center;justify-content:center">
                ${renderIllustrationSvg(activeRole.id, theme.accentHex)}
              </div>
            </section>

            <!-- 4-Axis Analysis -->
            <section class="card" style="padding:32px">
              <p class="section-kicker">01. 내 일하는 스타일 분석</p>
              <h2 class="section-title">${res.topAxes[0].label}과 ${res.topAxes[1].label}이 중심에 있어요</h2>
              <div class="axis-grid">
                <div style="background:${theme.softBgHex};border:1px solid ${theme.borderColor};border-radius:12px;padding:18px">
                  ${renderRadarSvg(res.axisScores, theme.accentHex)}
                </div>
                <div style="display:flex;flex-direction:column;gap:18px">
                  ${AXES.map((axis) => {
                    const score = res.axisScores[axis.key];
                    const isTop = axis.key === res.topAxes[0].key || axis.key === res.topAxes[1].key;
                    return `
                      <div>
                        <div style="display:flex;justify-content:space-between;align-items:baseline">
                          <span style="font-size:14px;font-weight:600">
                            ${axis.label}
                            ${isTop ? `<span style="margin-left:8px;font-size:12px;color:${theme.accentHex}">주요 성향</span>` : ''}
                          </span>
                          <span class="font-mono tabular-nums" style="font-size:14px;font-weight:600">${score}%</span>
                        </div>
                        <div class="bar-track">
                          <div class="bar-fill" style="transform:scaleX(${score / 100});background-color:${isTop ? theme.accentHex : '#9CA3AF'}"></div>
                        </div>
                        <p style="font-size:12px;color:var(--text-muted);margin:0">${axis.description}</p>
                      </div>
                    `;
                  }).join('')}
                </div>
              </div>
            </section>

            <!-- Easy Explanation & Strengths -->
            <section class="result-grid-2">
              <div class="card" style="padding:32px;display:flex;flex-direction:column;gap:24px">
                <div>
                  <p class="section-kicker">02. 직무 쉬운 해설</p>
                  <h2 style="font-size:20px;font-weight:700;margin:0 0 12px">이 직무, 쉽게 말해 무슨 일을 하나요?</h2>
                  <p style="font-size:15px;color:#374151;margin:0">${escapeHtml(activeRole.easyExplanation)}</p>
                </div>
                <div style="padding-top:20px;border-top:1px solid var(--border-hairline)">
                  <h3 style="font-size:16px;font-weight:700;margin:0 0 8px">산디 2학년 + 자동차·AI·UX 관심자에게 잘 맞는 이유</h3>
                  <p style="font-size:15px;color:#4B5563;margin:0">${escapeHtml(activeRole.whyItFitsSophomore)}</p>
                </div>
              </div>

              <div class="card" style="padding:32px;display:flex;flex-direction:column;gap:24px">
                <div>
                  <p class="section-kicker">03. 작업 스타일 강점</p>
                  <h2 style="font-size:20px;font-weight:700;margin:0 0 16px">이런 점이 강점으로 드러나요</h2>
                  <ul style="list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:12px">
                    ${activeRole.strengths.map((s, i) => `
                      <li style="display:flex;gap:10px;font-size:14px;color:#374151">
                        <span class="font-mono tabular-nums" style="font-size:12px;font-weight:700;color:${theme.accentHex}">0${i + 1}</span>
                        <span>${escapeHtml(s)}</span>
                      </li>
                    `).join('')}
                  </ul>
                </div>
                <div style="padding-top:20px;border-top:1px solid var(--border-hairline)">
                  <h3 style="font-size:14px;font-weight:700;margin:0 0 6px">작업할 때 함께 챙기면 좋은 점</h3>
                  <p style="font-size:14px;color:#4B5563;margin:0">${escapeHtml(activeRole.watchOut)}</p>
                </div>
              </div>
            </section>

            <!-- 2nd-Year Preparation Checklist -->
            <section class="card" style="padding:32px">
              <div style="display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:12px;margin-bottom:24px">
                <div>
                  <p class="section-kicker">04. 2학년 맞춤 준비 가이드</p>
                  <h2 style="font-size:22px;font-weight:700;margin:0">지금부터 가볍게 준비할 것</h2>
                </div>
                <span class="font-mono tabular-nums" style="font-size:12px;font-weight:600;color:#4B5563">
                  완료 체크 ${completedCount} / ${activeRole.prepRoadmap.length}
                </span>
              </div>

              <div class="result-grid-2">
                <div style="display:flex;flex-direction:column;gap:12px">
                  ${activeRole.prepRoadmap.map((item) => {
                    const checked = Boolean(state.checkedItems[item.id]);
                    return `
                      <button type="button" class="prep-btn ${checked ? 'checked' : ''}" data-prep-id="${item.id}">
                        <span style="font-size:16px;font-weight:700;color:${checked ? theme.accentHex : '#9CA3AF'};line-height:1.2">
                          ${checked ? '☑' : '☐'}
                        </span>
                        <div>
                          <p style="font-size:12px;font-weight:600;color:${theme.accentHex};margin:0 0 4px">${item.category}</p>
                          <p class="prep-title" style="font-size:15px;font-weight:600;margin:0 0 4px">${escapeHtml(item.title)}</p>
                          <p style="font-size:13px;color:#4B5563;margin:0">${escapeHtml(item.detail)}</p>
                        </div>
                      </button>
                    `;
                  }).join('')}
                </div>

                <div style="display:flex;flex-direction:column;gap:20px">
                  <div style="background:${theme.softBgHex};border:1px solid ${theme.borderColor};border-radius:12px;padding:22px">
                    <h3 style="font-size:16px;font-weight:700;margin:0 0 14px">입문용 추천 툴 3가지</h3>
                    ${activeRole.recommendedTools.map((t, i) => `
                      <div style="${i > 0 ? 'margin-top:14px;padding-top:14px;border-top:1px solid var(--border-hairline)' : ''}">
                        <p style="font-size:14px;font-weight:600;margin:0 0 4px">${escapeHtml(t.name)}</p>
                        <p style="font-size:13px;color:#4B5563;margin:0">${escapeHtml(t.reason)}</p>
                      </div>
                    `).join('')}
                  </div>

                  <div class="card" style="padding:22px">
                    <p class="section-kicker">함께 살펴보면 좋은 2순위 직무</p>
                    <h3 style="font-size:16px;font-weight:700;margin:0 0 6px">${escapeHtml(res.secondaryRole.title)}</h3>
                    <p style="font-size:13px;color:#4B5563;margin:0 0 14px">${escapeHtml(res.secondaryRole.oneLiner)}</p>
                    <button type="button" id="view-secondary-btn" style="background:none;border:none;padding:0;font-size:14px;font-weight:600;color:${theme.accentHex}">
                      2순위 직무 내용 보기 →
                    </button>
                  </div>
                </div>
              </div>
            </section>

            <!-- Compare All 4 Roles -->
            <section style="border-top:1px solid var(--border-strong);padding-top:32px">
              <div style="display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px">
                <div>
                  <p class="section-kicker">05. 다른 직무와 비교해 보기</p>
                  <h2 style="font-size:19px;font-weight:700;margin:0">4가지 직무 유형을 눌러 배경 색과 직무 설명을 비교해 보세요</h2>
                </div>
                ${!isPrimary ? `
                  <button type="button" id="back-primary-btn" style="background:none;border:none;font-size:14px;font-weight:600;color:${theme.accentHex}">
                    내 1순위 결과(${escapeHtml(res.primaryRole.title)})로 돌아가기
                  </button>
                ` : ''}
              </div>

              <div class="compare-grid">
                ${ROLE_ORDER.map((id) => {
                  const role = CAREER_TYPES[id];
                  const selected = id === state.viewedRoleId;
                  const isMine = id === res.primaryRole.id;
                  return `
                    <button type="button" class="compare-btn" data-compare-id="${id}"
                      style="background-color:${selected ? role.theme.cardBg : '#FFFFFF'};border-color:${selected ? role.theme.accentHex : 'var(--border-hairline)'}">
                      <div style="display:flex;justify-content:space-between;margin-bottom:6px">
                        <span style="font-size:12px;color:#4B5563">${role.indexLabel}${isMine ? ' · 내 1순위' : ''}</span>
                        <span class="font-mono tabular-nums" style="font-size:12px;font-weight:700;color:${role.theme.accentHex}">${res.roleMatchScores[id]}%</span>
                      </div>
                      <p style="font-size:14px;font-weight:700;margin:0">${escapeHtml(role.title)}</p>
                    </button>
                  `;
                }).join('')}
              </div>
            </section>
          </main>
        </div>
      `;
    }

    function startQuiz() {
      state.view = 'quiz';
      state.currentIndex = 0;
      state.answers = {};
      state.result = null;
      state.copied = false;
      window.scrollTo({ top: 0, behavior: 'smooth' });
      render();
    }

    function goHome() {
      state.view = 'start';
      window.scrollTo({ top: 0, behavior: 'smooth' });
      render();
    }

    function pickOption(optionId) {
      const q = QUIZ_QUESTIONS[state.currentIndex];
      state.answers[q.id] = optionId;
      render();

      window.setTimeout(() => {
        if (state.currentIndex < QUIZ_QUESTIONS.length - 1) {
          state.currentIndex += 1;
          window.scrollTo({ top: 0, behavior: 'smooth' });
        } else {
          state.result = calculateTestResult(state.answers);
          state.viewedRoleId = state.result.primaryRole.id;
          state.view = 'result';
          window.scrollTo({ top: 0, behavior: 'smooth' });
        }
        render();
      }, 140);
    }

    function render() {
      const root = document.getElementById('app-root');
      const headerCta = document.getElementById('header-cta');

      if (state.view === 'start') {
        headerCta.textContent = '시작하기';
        headerCta.className = 'btn-primary btn-sm';
        root.innerHTML = renderStart();
      } else if (state.view === 'quiz') {
        headerCta.textContent = '처음부터 다시';
        headerCta.className = 'btn-secondary';
        root.innerHTML = renderQuiz();
      } else {
        headerCta.textContent = '처음부터 다시';
        headerCta.className = 'btn-secondary';
        root.innerHTML = renderResult();
      }

      bindEvents();
    }

    function bindEvents() {
      const heroStart = document.getElementById('hero-start-btn');
      const previewStart = document.getElementById('preview-start-btn');
      const guideStart = document.getElementById('guide-start-btn');
      const scrollRoles = document.getElementById('scroll-roles-btn');

      if (heroStart) heroStart.onclick = startQuiz;
      if (previewStart) previewStart.onclick = startQuiz;
      if (guideStart) guideStart.onclick = startQuiz;
      if (scrollRoles) {
        scrollRoles.onclick = () => {
          document.getElementById('roles-section')?.scrollIntoView({ behavior: 'smooth' });
        };
      }

      document.querySelectorAll('[data-preview-role]').forEach((btn) => {
        btn.onclick = () => {
          state.previewRoleId = btn.getAttribute('data-preview-role');
          render();
        };
      });

      const backBtn = document.getElementById('quiz-back-btn');
      if (backBtn) {
        backBtn.onclick = () => {
          if (state.currentIndex > 0) {
            state.currentIndex -= 1;
            render();
          } else {
            goHome();
          }
        };
      }

      document.querySelectorAll('[data-option-id]').forEach((btn) => {
        btn.onclick = () => pickOption(btn.getAttribute('data-option-id'));
      });

      const shareBtn = document.getElementById('share-btn');
      if (shareBtn) {
        shareBtn.onclick = async () => {
          const active = CAREER_TYPES[state.viewedRoleId];
          const res = state.result;
          const summaryText = [
            '[나에게 맞는 직무 유형 테스트 결과]',
            `추천 직무 유형: ${active.title}`,
            `한 줄 소개: ${active.oneLiner}`,
            `일하는 스타일 지표: 물성·형태 ${res.axisScores.tactile}% · UX·흐름 ${res.axisScores.ux}% · AI·실험 ${res.axisScores.ai}% · 구조·기획 ${res.axisScores.system}%`,
            `2순위 추천 직무: ${res.secondaryRole.title}`,
            `지금 시작할 준비 1가지: ${active.prepRoadmap[0].title}`
          ].join('\n');

          const ok = await copyToClipboard(summaryText);
          if (ok) {
            state.copied = true;
            render();
            window.setTimeout(() => {
              state.copied = false;
              render();
            }, 2400);
          }
        };
      }

      const retakeBtn = document.getElementById('retake-btn');
      if (retakeBtn) retakeBtn.onclick = startQuiz;

      const secBtn = document.getElementById('view-secondary-btn');
      if (secBtn) {
        secBtn.onclick = () => {
          state.viewedRoleId = state.result.secondaryRole.id;
          window.scrollTo({ top: 0, behavior: 'smooth' });
          render();
        };
      }

      const backPrimaryBtn = document.getElementById('back-primary-btn');
      if (backPrimaryBtn) {
        backPrimaryBtn.onclick = () => {
          state.viewedRoleId = state.result.primaryRole.id;
          window.scrollTo({ top: 0, behavior: 'smooth' });
          render();
        };
      }

      document.querySelectorAll('[data-prep-id]').forEach((btn) => {
        btn.onclick = () => {
          const id = btn.getAttribute('data-prep-id');
          state.checkedItems[id] = !state.checkedItems[id];
          saveCheckedItems(state.checkedItems);
          render();
        };
      });

      document.querySelectorAll('[data-compare-id]').forEach((btn) => {
        btn.onclick = () => {
          state.viewedRoleId = btn.getAttribute('data-compare-id');
          state.copied = false;
          render();
        };
      });
    }

    document.getElementById('btn-home').onclick = goHome;
    document.getElementById('nav-start').onclick = goHome;
    document.getElementById('header-cta').onclick = startQuiz;

    document.querySelectorAll('[data-scroll]').forEach((btn) => {
      btn.onclick = () => {
        const targetId = btn.getAttribute('data-scroll');
        if (state.view !== 'start') {
          state.view = 'start';
          render();
          window.setTimeout(() => {
            document.getElementById(targetId)?.scrollIntoView({ behavior: 'smooth' });
          }, 60);
        } else {
          document.getElementById(targetId)?.scrollIntoView({ behavior: 'smooth' });
        }
      };
    });

    window.addEventListener('keydown', (e) => {
      if (state.view !== 'quiz') return;
      const map = { '1': 'A', '2': 'B', '3': 'C', '4': 'D' };
      if (map[e.key]) {
        e.preventDefault();
        pickOption(map[e.key]);
      } else if (e.key === 'ArrowLeft' && state.currentIndex > 0) {
        e.preventDefault();
        state.currentIndex -= 1;
        render();
      }
    });

    render();
  </script>
</body>
</html>
